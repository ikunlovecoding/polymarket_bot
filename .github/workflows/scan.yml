# Runs the paper bot on GitHub's servers, so it keeps going with your laptop closed.
# - Every hour (at minute 7) it runs one scan and saves the results back into this repo.
# - "Run workflow" on the Actions tab lets you start a check by hand.
# Nothing here uses a wallet, key or secret: the bot only reads public data.
# Every run's printed output is also saved to reports/run_log.txt, so it can be read from the repo.

name: paper-bot

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      task:
        description: "What to run"
        type: choice
        options: [check-feed, dry-run, scan]
        default: check-feed

permissions:
  contents: write   # needed only to save state/ledger/brief back to this repo

concurrency:
  group: paper-bot  # never two scans at once (they would fight over the account file)
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run tests (stop if anything is broken)
        run: python -m unittest discover -s tests

      - name: Run the bot
        shell: bash
        env:
          TASK: ${{ github.event_name == 'schedule' && 'scan' || inputs.task }}
        run: |
          mkdir -p reports
          case "$TASK" in
            check-feed) args="--check-feed" ;;
            dry-run)    args="--dry-run" ;;
            *)          args="" ;;
          esac
          { echo "task=$TASK  started=$(date -u +'%Y-%m-%d %H:%M:%S') UTC"; } > reports/run_log.txt
          set -o pipefail
          python -m bot.run $args 2>&1 | tee -a reports/run_log.txt

      - name: Save results to the repo
        if: always()
        run: |
          git config user.name "paper-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data reports Trade_Ledger.md Learning.md 2>/dev/null || git add -A data reports
          if git diff --cached --quiet; then
            echo "Nothing changed"
          else
            git commit -m "bot run $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase
            git push
          fi
